document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

(135)\"><\u002Frect><rect x=\"-7.5\" y=\"-40\" width=\"15\" height=\"13\" rx=\"3.5\" fill=\"#146B3D\" transform=\"rotate(180)\"><\u002Frect><rect x=\"-7.5\" y=\"-40\" width=\"15\" height=\"13\" rx=\"3.5\" fill=\"#146B3D\" transform=\"rotate(225)\"><\u002Frect><rect x=\"-7.5\" y=\"-40\" width=\"15\" height=\"13\" rx=\"3.5\" fill=\"#146B3D\" transform=\"rotate(270)\"><\u002Frect><rect x=\"-7.5\" y=\"-40\" width=\"15\" height=\"13\" rx=\"3.5\" fill=\"#146B3D\" transform=\"rotate(315)\"><\u002Frect>\n        <circle r=\"31\" fill=\"#146B3D\"><\u002Fcircle><circle r=\"12\" fill=\"#FFFFFF\"><\u002Fcircle><circle r=\"4.5\" fill=\"#146B3D\"><\u002Fcircle>\n      <\u002Fg>\n      <rect x=\"385\" y=\"30\" width=\"186\" height=\"56\" fill=\"#146B3D\"><\u002Frect>\n      <g stroke=\"#146B3D\" stroke-width=\"3\" fill=\"none\">\n        <rect x=\"385\" y=\"30\" width=\"186\" height=\"280\"><\u002Frect>\n        <path d=\"M447 30v280M509 30v280M385 86h186M385 142h186M385 198h186M385 254h186\"><\u002Fpath>\n      <\u002Fg>\n    <\u002Fsvg>\n  <\u002Fdiv>\n\n  <h2 style=\"font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 20px; break-after: avoid; margin: 0 0 10px; padding-bottom: 8px; border-bottom: 2px solid #146B3D; color: #15291D;\">Business<\u002Fh2>\n  <sc-raw-table style=\"width: 100%; border-collapse: collapse; font-family: 'Public Sans', sans-serif; font-size: 14.5px; color: #2A302C; margin: 0 0 34px;\">\n    <sc-raw-tbody>\n      <sc-raw-tr style=\"border-bottom: 1px solid #E7EFE9;\">\n        <sc-raw-td style=\"width: 132px; padding: 10px 0; color: #6B7570;\">Name<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding: 10px 0;\">Excel Automate<\u002Fsc-raw-td>\n      <\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom: 1px solid #E7EFE9;\">\n        <sc-raw-td style=\"padding: 10px 0; color: #6B7570;\">Domain<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding: 10px 0;\">excelautomate.com.au<\u002Fsc-raw-td>\n      <\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom: 1px solid #E7EFE9;\">\n        <sc-raw-td style=\"padding: 10px 0; color: #6B7570;\">Tagline<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding: 10px 0; font-weight: 700;\">Integrate · Accelerate · Transform<\u002Fsc-raw-td>\n      <\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom: 1px solid #E7EFE9;\">\n        <sc-raw-td style=\"padding: 10px 0; color: #6B7570;\">Audience<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding: 10px 0;\">Non-profit organisations with small IT teams; primarily admin staff managing data and workflows in Excel and other Microsoft 365 tools<\u002Fsc-raw-td>\n      <\u002Fsc-raw-tr>\n      <sc-raw-tr>\n        <sc-raw-td style=\"padding: 10px 0; color: #6B7570;\">Services<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding: 10px 0;\">Excel automation, system integration, workflow optimisation for non-profits<\u002Fsc-raw-td>\n      <\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n\n  <h2 style=\"font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 20px; break-after: avoid; margin: 0 0 12px; padding-bottom: 8px; border-bottom: 2px solid #146B3D; color: #15291D;\">Style<\u002Fh2>\n  <p style=\"font-family: 'Public Sans', sans-serif; font-size: 14.5px; line-height: 1.65; color: #2A302C; margin: 0 0 14px;\">Approachable, plain-language and practical — not corporate, not techy. The promise is removing friction, not showing off sophistication. Copy speaks to the reader's day: <em>tedious manual processes<\u002Fem>, <em>a handful of clicks<\u002Fem>. Bold weight is used sparingly, only on the phrase that carries the value.<\u002Fp>\n  <p style=\"font-family: 'Public Sans', sans-serif; font-size: 14.5px; line-height: 1.65; color: #2A302C; margin: 0 0 14px;\">Visually the brand is calm and two-tone: greens on off-white, generous whitespace, no gradients or drop-shadow decoration. Sections alternate off-white and the pale green tint to separate content without adding colour. Cards are white with a soft shadow and 18–20px corners; interactive elements use a 10–12px radius. One idea per band, always centred or set as a two-column pair.<\u002Fp>\n  <p style=\"font-family: 'Public Sans', sans-serif; font-size: 14.5px; line-height: 1.65; color: #2A302C; margin: 0 0 34px;\">Motion is slow and mechanical rather than flashy: cogs turn continuously at different speeds, data travels the strands and lands in the grid. Reveals are short fade-and-rise transitions on scroll. Nothing bounces, flashes, or demands attention — the animation should be noticed on second glance, not first.<\u002Fp>\n\n  <h2 style=\"font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 20px; break-after: avoid; margin: 0 0 12px; padding-bottom: 8px; border-bottom: 2px solid #146B3D; color: #15291D;\">Logo Mark<\u002Fh2>\n  <p style=\"font-family: 'Public Sans', sans-serif; font-size: 14.5px; line-height: 1.65; color: #2A302C; margin: 0 0 14px;\">The mark is a pair of solid cogs — representing integration and automation — feeding five strands that resolve into a three-column spreadsheet grid with a filled header row. Each cog is a solid disc with eight rounded rectangular teeth and a punched-out hub, matching the weight of the grid's stroke. The smaller cog sits upper-right of the larger, meshing diagonally.<\u002Fp>\n  <p style=\"font-family: 'Public Sans', sans-serif; font-size: 14.5px; line-height: 1.65; color: #2A302C; margin: 0 0 14px;\">The strands run in horizontally from behind the large cog, so they read as data already in motion. They travel as a tight bundle, separate at a common point just right of the cogs, and fan out to their rows — the middle strand staying dead straight the whole way. The two below the centre mirror the two above it. A left-to-right opacity gradient holds them near-invisible where they emerge and brings them to full strength just past the separation point.<\u002Fp>\n  <p style=\"font-family: 'Public Sans', sans-serif; font-size: 14.5px; line-height: 1.65; color: #2A302C; margin: 0 0 20px;\">Clear space: keep at least the height of the small cog free on all sides of the lockup. The mark may be used alone; the wordmark should not appear without it except in running text.<\u002Fp>\n\n  <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 0 0 34px; break-inside: avoid;\">\n    <div style=\"border: 1px solid #E7EFE9; border-radius: 12px; padding: 22px; background: #FCFDFC;\">\n      <p style=\"font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 10px; letter-spacing: 0.18em; color: #146B3D; margin: 0 0 14px;\">LOCKUP<\u002Fp>\n      <div style=\"display: flex; align-items: center; gap: 12px;\">\n        <svg sc-camel-view-box=\"62 22 517 296\" width=\"86\" height=\"49\" sc-camel-preserve-aspect-ratio=\"xMidYMid meet\" aria-hidden=\"true\">\n          <g fill=\"none\" stroke=\"#146B3D\" stroke-width=\"4\" stroke-opacity=\"0.8\">\n            <path d=\"M150 166H230C285 166 300 58 385 58\"><\u002Fpath>\n            <path d=\"M150 168H236C276 168 308 114 385 114\"><\u002Fpath>\n            <path d=\"M150 170H385\"><\u002Fpath>\n            <path d=\"M150 171H236C276 171 308 226 385 226\"><\u002Fpath>\n            <path d=\"M150 173H230C285 173 300 282 385 282\"><\u002Fpath>\n          <\u002Fg>\n          <g transform=\"translate(157,200) rotate(11)\">\n            <rect x=\"-13\" y=\"-72\" width=\"26\" height=\"22\" rx=\"6\" fill=\"#146B3D\"><\u002Frect><rect x=\"-13\" y=\"-72\" width=\"26\" height=\"22\" rx=\"6\" fill=\"#146B3D\" transform=\"rotate(45)\"><\u002Frect><rect x=\"-13\" y=\"-72\" width=\"26\" height=\"22\" rx=\"6\" fill=\"#146B3D\" transform=\"rotate(90)\"><\u002Frect><rect x=\"-13\" y=\"-72\" width=\"26\" height=\"22\" rx=\"6\" fill=\"#146B3D\" transform=\"rotate(135)\"><\u002Frect><rect x=\"-13\" y=\"-72\" width=\"26\" height=\"22\" rx=\"6\" fill=\"#146B3D\" transform=\"rotate(180)\"><\u002Frect><rect x=\"-13\" y=\"-72\" width=\"26\" height=\"22\" rx=\ \n          <div style=\"width: 16px; height: 16px; border-radius: 3px; background: #146B3D; display: flex; align-items: center; justify-content: center; overflow: hidden;\">\n            <svg sc-camel-view-box=\"68 110 180 182\" width=\"12\" height=\"12\" aria-hidden=\"true\">\n              <g transform=\"translate(157,200) rotate(11)\">\n                <rect x=\"-13\" y=\"-72\" width=\"26\" height=\"22\" rx=\"6\" fill=\"#FFFFFF\"><\u002Frect><rect x=\"-13\" y=\"-72\" width=\"26\" height=\"22\" rx=\"6\" fill=\"#FFFFFF\" transform=\"rotate(45)\"><\u002Frect><rect x=\"-13\" y=\"-72\" width=\"26\" height=\"22\" rx=\"6\" fill=\"#FFFFFF\" transform=\"rotate(90)\"><\u002Frect><rect x=\"-13\" y=\"-72\" width=\"26\" height=\"22\" rx=\"6\" fill=\"#FFFFFF\" transform=\"rotate(135)\"><\u002Frect><rect x=\"-13\" y=\"-72\" width=\"26\" height=\"22\" rx=\"6\" fill=\"#FFFFFF\" transform=\"rotate(180)\"><\u002Frect><rect x=\"-13\" y=\"-72\" width=\"26\" height=\"22\" rx=\"6\" fill=\"#FFFFFF\" transform=\"rotate(225)\"><\u002Frect><rect x=\"-13\" y=\"-72\" width=\"26\" height=\"22\" rx=\"6\" fill=\"#FFFFFF\" transform=\"rotate(270)\"><\u002Frect><rect x=\"-13\" y=\"-72\" width=\"26\" height=\"22\" rx=\"6\" fill=\"#FFFFFF\" transform=\"rotate(315)\"><\u002Frect>\n                <circle r=\"54\" fill=\"#FFFFFF\"><\u002Fcircle><circle r=\"21\" fill=\"#146B3D\"><\u002Fcircle><circle r=\"8\" fill=\"#FFFFFF\"><\u002Fcircle>\n              <\u002Fg>\n            <\u002Fsvg>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-family: 'Public Sans', sans-serif; font-size: 11.5px; line-height: 1.5; color: #6B7570; margin: 14px 0 0;\">Two avatar options (two cogs, or a cog over the table corner). Favicon uses both cogs down to 32px and a single cog at 16px.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <h2 style=\"font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 20px; break-after: avoid; margin: 0 0 12px; padding-bottom: 8px; border-bottom: 2px solid #146B3D; color: #15291D;\">Animation<\u002Fh2>\n  <p style=\"font-family: 'Public Sans', sans-serif; font-size: 14.5px; line-height: 1.65; color: #2A302C; margin: 0 0 14px;\">The mark has a static and an animated version sharing identical geometry, so they are interchangeable. In the animated version the large cog turns clockwise over 26 seconds and the small cog anticlockwise over 17 — deliberately unmatched, so the pattern never visibly repeats. A dot travels each strand on a 3.2-second loop, staggered 0.55 seconds apart, fading in as it clears the cogs. As each dot lands, the grid's header row dips and a cell in the first column flashes.<\u002Fp>\n  <sc-raw-table style=\"width: 100%; border-collapse: collapse; font-family: 'Public Sans', sans-serif; font-size: 14px; color: #2A302C; margin: 0 0 34px;\">\n    <sc-raw-thead>\n      <sc-raw-tr style=\"border-bottom: 1px solid #E7EFE9;\">\n        <sc-raw-th style=\"text-align: left; padding: 8px 0; font-family: 'Manrope', sans-serif; font-weight: 700;\">Element<\u002Fsc-raw-th>\n        <sc-raw-th style=\"text-align: left; padding: 8px 0; font-family: 'Manrope', sans-serif; font-weight: 700;\">Timing<\u002Fsc-raw-th>\n      <\u002Fsc-raw-tr>\n    <\u002Fsc-raw-thead>\n    <sc-raw-tbody>\n      <sc-raw-tr style=\"border-bottom: 1px solid #E7EFE9;\"><sc-raw-td style=\"padding: 8px 0;\">Large cog<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 0;\">26s linear, clockwise, infinite<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom: 1px solid #E7EFE9;\"><sc-raw-td style=\"padding: 8px 0;\">Small cog<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 0;\">17s linear, anticlockwise, infinite<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom: 1px solid #E7EFE9;\"><sc-raw-td style=\"padding: 8px 0;\">Strand dots<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 0;\">3.2s loop, 0.55s stagger, fade in over the first 28%<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"padding: 8px 0;\">Header pulse / cell flash<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 0;\">3.2s, offset to each dot's arrival<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n\n\n  <h2 style=\"font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 20px; break-after: avoid; margin: 0 0 14px; padding-bottom: 8px; border-bottom: 2px solid #146B3D; color: #15291D;\">Colour Palette<\u002Fh2>\n  <p style=\"font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 10px; letter-spacing: 0.18em; color: #146B3D; margin: 0 0 12px;\">CORE<\u002Fp>\n  <div style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 0 0 22px; break-inside: avoid;\">\n    <div>\n      <div style=\"height: 62px; border-radius: 10px; background: #146B3D;\"><\u002Fdiv>\n      <p style=\"font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 13px; margin: 8px 0 2px; color: #15291D;\">Brand Green<\u002Fp>\n      <p style=\"font-family: 'Public Sans', sans-serif; font-size: 11.5px; color: #6B7570; margin: 0;\">#146B3D · mark, links, CTA<\u002Fp>\n    <\u002Fdiv>\n    <div>\n      <div style=\"height: 62px; border-radius: 10px; background: #0F5230;\"><\u002Fdiv>\n      <p style=\"font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 13px; margin: 8px 0 2px; color: #15291D;\">Deep Green<\u002Fp>\n      <p style=\"font-family: 'Public Sans', sans-serif; font-size: 11.5px; color: #6B7570; margin: 0;\">#0F5230 · hover, pressed<\u002Fp>\n    <\u002Fdiv>\n    <div>\n      <div style=\"height: 62px; border-radius: 10px; background: #1E9E58;\"><\u002Fdiv>\n      <p style=\"font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 13px; margin: 8px 0 2px; color: #15291D;\">Light Green<\u002Fp>\n      <p style=\"font-family: 'Public Sans', sans-serif; font-size: 11.5px; color: #6B7570; margin: 0;\">#1E9E58 · link hover<\u002Fp>\n    <\u002Fdiv>\n    <div>\n      <div style=\"height: 62px ly: 'Manrope', sans-serif; font-weight: 700; font-size: 13px; margin: 8px 0 2px; color: #15291D;\">Body text<\u002Fp>\n      <p style=\"font-family: 'Public Sans', sans-serif; font-size: 11.5px; color: #6B7570; margin: 0;\">#3A3F3C · borders #E7EFE9<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"font-family: 'Public Sans', sans-serif; font-size: 13.5px; line-height: 1.6; color: #2A302C; margin: 0 0 34px; padding: 14px 16px; background: #F3FAF6; border-left: 3px solid #146B3D; border-radius: 0 8px 8px 0;\">The palette is intentionally two-tone: greens on off-white. Near-black #15291D carries headings and the “Excel” half of the wordmark — it reads as black but stays in the green family. Avoid introducing new accent colours.<\u002Fp>\n\n  <h2 style=\"font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 20px; break-after: avoid; margin: 0 0 12px; padding-bottom: 8px; border-bottom: 2px solid #146B3D; color: #15291D;\">Typography<\u002Fh2>\n  <sc-raw-table style=\"width: 100%; border-collapse: collapse; font-family: 'Public Sans', sans-serif; font-size: 14px; color: #2A302C; margin: 0 0 20px;\">\n    <sc-raw-thead>\n      <sc-raw-tr style=\"border-bottom: 1px solid #E7EFE9;\">\n        <sc-raw-th style=\"text-align: left; padding: 8px 0; width: 150px; font-family: 'Manrope', sans-serif; font-weight: 700;\">Role<\u002Fsc-raw-th>\n        <sc-raw-th style=\"text-align: left; padding: 8px 0; font-family: 'Manrope', sans-serif; font-weight: 700;\">Typeface<\u002Fsc-raw-th>\n        <sc-raw-th style=\"text-align: left; padding: 8px 0; font-family: 'Manrope', sans-serif; font-weight: 700;\">Notes<\u002Fsc-raw-th>\n      <\u002Fsc-raw-tr>\n    <\u002Fsc-raw-thead>\n    <sc-raw-tbody>\n      <sc-raw-tr style=\"border-bottom: 1px solid #E7EFE9;\"><sc-raw-td style=\"padding: 8px 0; color: #6B7570;\">Wordmark<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 0;\">Space Grotesk 700<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 0;\">Logo only; −0.02em tracking<\u 0 0 12px; padding-bottom: 8px; border-bottom: 2px solid #146B3D; color: #15291D;\">Patterns<\u002Fh2>\n  <p style=\"font-family: 'Public Sans', sans-serif; font-size: 14.5px; line-height: 1.65; color: #2A302C; margin: 0 0 18px;\">The values below are taken from the landing page, which is the reference implementation. New pages should reuse them rather than inventing their own spacing or states.<\u002Fp>\n\n  <p style=\"font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 10px; letter-spacing: 0.18em; color: #146B3D; margin: 0 0 10px;\">SECTION RHYTHM<\u002Fp>\n  <p style=\"font-family: 'Public Sans', sans-serif; font-size: 14px; line-height: 1.65; color: #2A302C; margin: 0 0 12px;\">Every section is a full-bleed band with a 24px side gutter and fluid vertical padding. Adjacent bands should not share a background, so that each reads as its own idea — unless two bands are deliberately meant to read as one block, in which case they share a background and the gap between them tightens. The landing page does both: its sequence runs light, light, tint, green, near-black, tint, where the opening two are the hero and carousel joined as one block. The sequence itself is per-page; the rule and its exception are what carry across.<\u002Fp>\n  <sc-raw-table style=\"width: 100%; border-collapse: collapse; font-family: 'Public Sans', sans-serif; font-size: 14px; color: #2A302C; margin: 0 0 22px; break-inside: avoid;\">\n    <sc-raw-thead>\n      <sc-raw-tr style=\"border-bottom: 1px solid #E7EFE9;\">\n        <sc-raw-th style=\"text-align: left; padding: 8px 0; width: 130px; font-family: 'Manrope', sans-serif; font-weight: 700;\">Band<\u002Fsc-raw-th>\n        <sc-raw-th style=\"text-align: left; padding: 8px 0; width: 92px; font-family: 'Manrope', sans-serif; font-weight: 700;\">Background<\u002Fsc-raw-th>\n        <sc-raw-th style=\"text-align: left; padding: 8px 0; font-family: 'Manrope', sans-serif; font-weight: 700;\">Vertical padding (top / bottom)<\u002Fs -raw-td><sc-raw-td style=\"padding: 8px 0; font-family: ui-monospace, monospace; font-size: 12px;\">clamp(56,9vw,100) both<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"padding: 8px 0; color: #6B7570;\">Footer<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 0; font-family: ui-monospace, monospace; font-size: 12px;\">#F3FAF6<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 0; font-family: ui-monospace, monospace; font-size: 12px;\">34 / 30<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n\n  <p style=\"font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 10px; letter-spacing: 0.18em; color: #146B3D; margin: 0 0 10px;\">LAYOUT WIDTHS<\u002Fp>\n  <sc-raw-table style=\"width: 100%; border-collapse: collapse; font-family: 'Public Sans', sans-serif; font-size: 14px; color: #2A302C; margin: 0 0 22px; break-inside: avoid;\">\n    <sc-raw-tbody>\n      <sc-raw-tr style=\"border-bottom: 1px solid #E7EFE9;\"><sc-raw-td style=\"padding: 8px 0; width: 200px; color: #6B7570;\">Page content<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 0;\">max 1240px, centred<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom: 1px solid #E7EFE9;\"><sc-raw-td style=\"padding: 8px 0; color: #6B7570;\">Carousel block<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 0;\">max 1000px, centred<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom: 1px solid #E7EFE9;\"><sc-raw-td style=\"padding: 8px 0; color: #6B7570;\">CTA copy<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 0;\">max 720px, centred<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom: 1px solid #E7EFE9;\"><sc-raw-td style=\"padding: 8px 0; color: #6B7570;\">Prose measure<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 0;\">max 820px, centred. Any page whose main content is continuous body copy uses this, not the 1240px container - long-form text at full container width is unreadable<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom: 1px solid #E7EFE9;\"><sc-raw-td style=\"padding: 8px 0; color: #6B7570;\">Section nav column<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 0;\">176px, with the content taking the rest. Roughly 40px wider than the longest label needs; the slack is deliberate, so the active item reads as a pill rather than a tight box<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"padding: 8px 0; color: #6B7570;\">Content spine<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 0;\">Hero copy aligns to the carousel card's left edge plus half a card padding — the landing page's left margin, balanced against the carousel. Not used on other pages, which use the standard centred container<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n\n  <p style=\"font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 10px; letter-spacing: 0.18em; color: #146B3D; margin: 0 0 10px;\">BUTTONS<\u002Fp>\n  <p style=\"font-family: 'Public Sans', sans-serif; font-size: 14px; line-height: 1.65; color: #2A302C; margin: 0 0 12px;\">Two variants, identical geometry: Manrope 700 at 17px, 14px&nbsp;×&nbsp;34px padding, 10px radius, 190px minimum width, 0.2s ease transitions. Both lift 2px on hover and settle back on press. Solid is used on the green band, ghost on the near-black band; never both in one section.<\u002Fp>\n  <sc-raw-table style=\"width: 100%; border-collapse: collapse; font-family: 'Public Sans', sans-serif; font-size: 14px; color: #2A302C; margin: 0 0 22px; break-inside: avoid;\">\n    <sc-raw-thead>\n      <sc-raw-tr style=\"border-bottom: 1px solid #E7EFE9;\">\n        <sc-raw-th style=\"text-align: left; padding: 8px 0; width: 110px; font-family: 'Manrope', sans-serif; font-weight: 700;\">Variant<\u002Fsc-raw-th>\n        <sc-raw-th style=\"text-align: left; padding: 8px 0; font-family: 'Manrope', sans-serif; font-weight: 700;\">Rest<\u002Fsc-raw-th>\n        <sc-raw-th style=\"text-align: left; padding: 8px 0; font-family: 'Manrope', sans-serif; font-weight: 700;\">Hover<\u002Fsc-raw-th>\n      <\u002Fsc-raw-tr>\n    <\u002Fsc-raw-thead>\n    <sc-raw-tbody>\n      <sc-raw-tr style=\"border-bottom: 1px solid #E7EFE9;\"><sc-raw-td style=\"padding: 8px 0; color: #6B7570;\">Solid<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 0; font-family: ui-monospace, monospace; font-size: 12px;\">#ffffff on #146B3D<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 0; font-family: ui-monospace, monospace; font-size: 12px;\">#DFF3E8 fill, drop shadow<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom: 1px solid #E7EFE9;\"><sc-raw-td style=\"padding: 8px 0; color: #6B7570;\">Ghost<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 0; font-family: ui-monospace, monospace; font-size: 12px;\">2px #34D17F border, transparent<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 0; font-family: ui-monospace, monospace; font-size: 12px;\">#34D17F fill, #15291D text<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"padding: 8px 0; color: #6B7570;\">Nav CTA<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 0; font-family: ui-monospace, monospace; font-size: 12px;\">#ffffff on #146B3D, 18px<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 0; font-family: ui-monospace, monospace; font-size: 12px;\">Darkens; no lift in the header<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n\n  <p style=\"font-family: 'Public Sans', sans-serif; font-size: 14px; line-height: 1.65; color: #2A302C; margin: 0 0 12px;\">Two variants only. Where a third level of emphasis is genuinely needed, use a <strong>text link<\u002Fstrong> - never a third button variant.<\u002Fp>\n\n  <p style=\"font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 10px; letter-spacing: 0.18em; color: #146B3D; margin: 0 0 10px;\">CAROUSEL<\u002Fp>\n  <p style=\"font-family: 'Public Sans', sans-serif; font-size: 14px; line-height: 1.65; color: #2A302C; margin: 0 0 22px;\">Cards are <code style=\"font-family: ui-monospace, monospace; font-size: 12.5px;\">min(640, max(260, 68vw))<\u002Fcode> wide with a 28px gap and a 20px radius, alternating brand green and near-black. Neighbouring cards sit at 40% opacity; anything further out is hidden. The back peek is <code style=\"font-family: ui-monospace, monospace; font-size: 12.5px;\">min(90, max(28, 9vw))<\u002Fcode> and the forward peek is 1.3× that, so the eye is pulled onward. A duplicate of the last card fills the back peek from the start, and both edges carry the same white gradient — only the “&lt;” chevron appears once you have moved off the first card. Once the deck wraps past the end, back stays available for good.<\u002Fp>\n\n  <p style=\"font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 10px; letter-spacing: 0.18em; color: #146B3D; margin: 0 0 10px;\">MOTION &amp; STATES<\u002Fp>\n  <sc-raw-table style=\"width: 100%; border-collapse: collapse; font-family: 'Public Sans', sans-serif; font-size: 14px; color: #2A302C; margin: 0 0 22px; break-inside: avoid;\">\n    <sc-raw-tbody>\n      <sc-raw-tr style=\"border-bottom: 1px solid #E7EFE9;\"><sc-raw-td style=\"padding: 8px 0; width: 200px; color: #6B7570;\">Scroll reveal<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 0;\">Fade + 26px rise, 0.7s <code style=\"font-family: ui-monospace, monospace; font-size: 12px;\">cubic-bezier(0.22,1,0.36,1)<\u002Fcode>, fires at 92% of the viewport<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom: 1px solid #E7EFE9;\"><sc-raw-td style=\"padding: 8px 0; color: #6B7570;\">Stagger<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 0;\">90ms between service cards; single-shot for the two CTA bands<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom: 1px solid #E7EFE9;\"><sc-raw-td style=\"padding: 8px 0; color: #6B7570;\">Card change<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 0;\">0.55s slide, 0.5s opacity cross-fade<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom: 1px solid #E7EFE9;\"><sc-raw-td style=\"padding: 8px 0; color: #6B7570;\">Hover lift<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 0;\">−2px translate over 0.2s ease<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"padding: 8px 0; color: #6B7570;\">Nav underline<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 0;\">Grows from the left; active item stays underlined<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n  <p style=\"font-family: 'Public Sans', sans-serif; font-size: 14px; line-height: 1.65; color: #2A302C; margin: 10px 0 8px;\">Cards and tiles in a grid reveal over <strong>0.65s<\u002Fstrong> with the 90ms stagger; text blocks and section panels over <strong>0.7s<\u002Fstrong>. Both a 26px rise, both firing at 92% of the viewport.<\u002Fp>\n  <p style=\"font-family: 'Public Sans', sans-serif; font-size: 14px; line-height: 1.65; color: #2A302C; margin: 0 0 22px;\">Where reveals replay on scroll-back they may only re-arm <strong>downward<\u002Fstrong> - an element above the viewport stays revealed. Re-arming in both directions produced a render loop that left a whole page invisible during the design phase; this is not a stylistic preference.<\u002Fp>\n\n  <p style=\"font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 10px; letter-spacing: 0.18em; color: #146B3D; margin: 0 0 10px;\">BREAKPOINTS<\u002Fp>\n  <sc-raw-table style=\"width: 100%; border-collapse: collapse; font-family: 'Public Sans', sans-serif; font-size: 14px; color: #2A302C; margin: 0 0 34px; break-inside: avoid;\">\n    <sc-raw-tbody>\n      <sc-raw-tr style=\"border-bottom: 1px solid #E7EFE9;\"><sc-raw-td style=\"padding: 8px 0; width: 110px; font-family: ui-monospace, monospace; font-size: 12.5px;\">1180px<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 0;\">Nav collapses to the burger menu<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom: 1px solid #E7EFE9;\"><sc-raw-td style=\"padding: 8px 0; font-family: ui-monospace, monospace; font-size: 12.5px;\">720px<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 0;\">Hero mark hides; copy takes the full width<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom: 1px solid #E7EFE9;\"><sc-raw-td style=\"padding: 8px 0; font-family: ui-monospace, monospace; font-size: 12.5px;\">640px<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 0;\">Lockup tagline hides<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom: 1px solid #E7EFE9;\"><sc-raw-td style=\"padding: 8px 0; font-family: ui-monospace, monospace; font-size: 12.5px;\">420px<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 0;\">Lockup drops to the mark alone<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"padding: 8px 0; font-family: ui-monospace, monospace; font-size: 12.5px;\">320px<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 0;\">Minimum supported width<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n\n  <h2 style=\"font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 20px; break-after: avoid; margin: 0 0 12px; padding-bottom: 8px; border-bottom: 2px solid #146B3D; color: #15291D;\">Components<\u002Fh2>\n  <p style=\"font-family: 'Public Sans', sans-serif; font-size: 14.5px; line-height: 1.65; color: #2A302C; margin: 0 0 10px;\">Added in v3, from the Our approach, For non-profits, About and Contact pages. Each of these now appears on more than one page, so it belongs here rather than in a single page’s notes.<\u002Fp>\n  <h3 style=\"font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 10px; letter-spacing: 0.18em; break-after: avoid; margin: 18px 0 10px; color: #146B3D;\">PULLED-OUT LINE<\u002Fh3>\n  <p style=\"font-family: 'Public Sans', sans-serif; font-size: 14.5px; line-height: 1.65; color: #2A302C; margin: 0 0 10px;\">One of the two Spectral uses (see Typography). 3px solid brand green left rule, 20px padding-left, no background. Spectral 300 italic inside, nothing else in the block. <strong>clamp(17px,2vw,20px)<\u002Fstrong> where it supports a paragraph, <strong>clamp(19px,2.4vw,25px)<\u002Fstrong> where it closes a section.<\u002Fp>\n  <h3 style=\"font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 10px; letter-spacing: 0.18em; break-after: avoid; margin: 18px 0 10px; color: #146B3D;\">CARDS AND TILES<\u002Fh3>\n  <p style=\"font-family: 'Public Sans', sans-serif; font-size: 14.5px; line-height: 1.65; color: #2A302C; margin: 0 0 10px;\"><strong>The hover lift belongs to clickable cards only.<\u002Fstrong> A card that rises and deepens its shadow is making a promise. A visitor who clicks one and gets nothing stops trusting the signal everywhere else on the site.<\u002Fp>\n  <p style=\"font-family: 'Public Sans', sans-serif; font-size: 14.5px; line-height: 1.65; color: #2A302C; margin: 0 0 10px;\"><strong>Clickable<\u002Fstrong> - white surface, 18px radius (16px nested inside a panel), <strong>0 2px 10px rgba(20,40,30,0.06)<\u002Fstrong> at rest, lifting <strong>translateY(-4px)<\u002Fstrong> to <strong>0 16px 34px rgba(20,107,61,0.16)<\u002Fstrong> over 0.3s. The whole card is the link, not just its title.<\u002Fp>\n  <p style=\"font-family: 'Public Sans', sans-serif; font-size: 14.5px; line-height: 1.65; color: #2A302C; margin: 0 0 10px;\"><strong>Static<\u002Fstrong> - identical surface and shadow, no transition, no hover state.<\u002Fp>\n  <p style=\"font-family: 'Public Sans', sans-serif; font-size: 14.5px; line-height: 1.65; color: #2A302C; margin: 0 0 10px;\">On a dark panel both shadows switch to neutral black: <strong>0 2px 10px rgba(0,0,0,0.10)<\u002Fstrong> at rest, <strong>0 16px 34px rgba(0,0,0,0.28)<\u002Fstrong> on hover. The green shadow disappears against dark backgrounds.<\u002Fp>\n  <p style=\"font-family: 'Public Sans', sans-serif; font-size: 13.5px; line-height: 1.6; color: #6B7570; margin: 0 0 10px; padding-left: 14px; border-left: 3px solid #E7EFE9;\">A missing hover state looks like an oversight rather than a decision, so this is the rule most likely to be undone by someone tidying up.<\u002Fp>\n  <h3 style=\"font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 10px; letter-spacing: 0.18em; break-after: avoid; margin: 18px 0 10px; color: #146B3D;\">FORM CONTROLS<\u002Fh3>\n  <p style=\"font-family: 'Public Sans', sans-serif; font-size: 14.5px; line-height: 1.65; color: #2A302C; margin: 0 0 10px;\"><strong>Field<\u002Fstrong> - full width, 16px text in #1A1A1A, #FCFDFC fill, 1.5px #E7EFE9 border, 10px radius, 13px/15px padding.<\u002Fp>\n  <p style=\"font-family: 'Public Sans', sans-serif; font-size: 14.5px; line-height: 1.65; color: #2A302C; margin: 0 0 10px;\"><strong>Focus<\u002Fstrong> - border to brand green plus a <strong>0 0 0 3px rgba(20,107,61,0.12)<\u002Fstrong> ring, both over 0.2s. Never remove the ring without replacing it.<\u002Fp>\n  <p style=\"font-family: 'Public Sans', sans-serif; font-size: 14.5px; line-height: 1.65; color: #2A302C; margin: 0 0 10px;\"><strong>Label<\u002Fstrong> - Manrope 700, 14px, #15291D, 7px above its field. <strong>Placeholder<\u002Fstrong> - #6B7570 at 85% opacity, used only where it says something the label cannot, such as “Optional”. Not for example answers.<\u002Fp>\n  <p style=\"font-family: 'Public Sans', sans-serif; font-size: 14.5px; line-height: 1.65; color: #2A302C; margin: 0 0 10px;\"><strong>Textarea<\u002Fstrong> - as a field, 1.6 line-height, vertically resizable. <strong>Field grid<\u002Fstrong> - 18px gap, two-up above 560px and stacked below.<\u002Fp>\n  <h3 style=\"font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 10px; letter-spacing: 0.18em; break-after: avoid; margin: 18px 0 10px; color: #146B3D;\">SEGMENTED CONTROL<\u002Fh3>\n  <p style=\"font-family: 'Public Sans', sans-serif; font-size: 14.5px; line-height: 1.65; color: #2A302C; margin: 0 0 10px;\">Two or three options in a row, each an equal-width button: Manrope 700 15.5px, 12px/16px padding, 10px radius, 1.5px border. Optional 19px icon before the label.<\u002Fp>\n  <p style=\"font-family: 'Public Sans', sans-serif; font-size: 14.5px; line-height: 1.65; color: #2A302C; margin: 0 0 10px;\"><strong>Unselected<\u002Fstrong> - #4A4F4C text, #FCFDFC fill, #E7EFE9 border. <strong>Selected<\u002Fstrong> - brand green text, icon-tile green fill, brand green border.<\u002Fp>\n  <p style=\"font-family: 'Public Sans', sans-serif; font-size: 14.5px; line-height: 1.65; color: #2A302C; margin: 0 0 10px;\">Use instead of radio buttons where there are few enough options to show at once - but back it with a real radio group so the value submits and it works from the keyboard.<\u002Fp>\n  <h3 style=\"font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 10px; letter-spacing: 0.18em; break-after: avoid; margin: 18px 0 10px; color: #146B3D;\">SUB-MENU<\u002Fh3>\n  <p style=\"font-family: 'Public Sans', sans-serif; font-size: 14.5px; line-height: 1.65; color: #2A302C; margin: 0 0 10px;\">Opens on hover beneath a nav item, with a 12px transparent bridge above the panel so the cursor cannot fall through the gap.<\u002Fp>\n  <p style=\"font-family: 'Public Sans', sans-serif; font-size: 14.5px; line-height: 1.65; color: #2A302C; margin: 0 0 10px;\"><strong>Panel<\u002Fstrong> - white, 1px #E7EFE9 border, 12px radius, <strong>0 12px 28px rgba(20,40,30,0.12)<\u002Fstrong>, 8px padding, 190px minimum width. Fades in and rises 6px over 0.2s.<\u002Fp>\n  <p style=\"font-family: 'Public Sans', sans-serif; font-size: 14.5px; line-height: 1.65; color: #2A302C; margin: 0 0 10px;\"><strong>Items<\u002Fstrong> - Manrope 600 16px, #1A1A1A, 10px/16px padding, 8px radius; on hover, icon-tile green fill and brand green text over 0.18s.<\u002Fp>\n  <p style=\"font-family: 'Public Sans', sans-serif; font-size: 14.5px; line-height: 1.65; color: #2A302C; margin: 0 0 10px;\">Where the nav collapses to a burger menu, sub-items render as an indented list under the parent with a 2px left rule, not as a flyout.<\u002Fp>\n  <p style=\"font-family: 'Public Sans', sans-serif; font-size: 13.5px; line-height: 1.6; color: #6B7570; margin: 0 0 10px; padding-left: 14px; border-left: 3px solid #E7EFE9;\">The parent item stays a working link to its own page - the sub-menu is a shortcut, never the only way in. Its first item should be the page’s own entry point, or visitors read the second item as the place to start.<\u002Fp>\n  <h3 style=\"font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 10px; letter-spacing: 0.18em; break-after: avoid; margin: 18px 0 10px; color: #146B3D;\">IMAGE PLACEHOLDER<\u002Fh3>\n  <p style=\"font-family: 'Public Sans', sans-serif; font-size: 14.5px; line-height: 1.65; color: #2A302C; margin: 0 0 10px;\">Where a real image is not yet available: icon-tile green fill, the surface’s own radius, and a 1px dashed brand green border at 35% opacity. Deliberately empty - no icon, no illustration, no “image here” text. It should read as unfinished, because it is.<\u002Fp>\n\n  <h2 style=\"font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 20px; break-after: avoid; margin: 0 0 12px; padding-bottom: 8px; border-bottom: 2px solid #146B3D; color: #15291D;\">Copy Rules<\u002Fh2>\n  <p style=\"font-family: 'Public Sans', sans-serif; font-size: 14.5px; line-height: 1.65; color: #2A302C; margin: 0 0 10px;\"><strong>Spaced hyphens ( - ), never em or en dashes.<\u002Fstrong> Everywhere: body copy, headings, page titles, meta descriptions, og: tags.<\u002Fp>\n  <p style=\"font-family: 'Public Sans', sans-serif; font-size: 14.5px; line-height: 1.65; color: #2A302C; margin: 0 0 10px;\"><strong>“non-profits”, hyphenated.<\u002Fstrong> Never “nonprofits”. Nav labels, body copy, headings, meta descriptions.<\u002Fp>\n  <p style=\"font-family: 'Public Sans', sans-serif; font-size: 14.5px; line-height: 1.65; color: #2A302C; margin: 0 0 10px;\"><strong>Emphasis colour is used sparingly<\u002Fstrong> - two or three green terms per page, and fewer on a long page. It is the only inline emphasis the palette has, and it stops working when it appears often.<\u002Fp>\n  <p style=\"font-family: 'Public Sans', sans-serif; font-size: 14.5px; line-height: 1.65; color: #2A302C; margin: 0 0 10px;\"><strong>Nav labels are sentence case<\u002Fstrong>, with capitals only for product names: “Get in touch”, “About”, “Our approach”, “For non-profits” - but “Modern Excel” and “Excel tips”.<\u002Fp>\n\n  <h2 style=\"font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 20px; break-after: avoid; margin: 0 0 12px; padding-bottom: 8px; border-bottom: 2px solid #146B3D; color: #15291D;\">Brand Pack Contents<\u002Fh2>\n  <sc-raw-table style=\"width: 100%; border-collapse: collapse; font-family: 'Public Sans', sans-serif; font-size: 14px; color: #2A302C; margin: 0 0 18px;\">\n    <sc-raw-thead>\n      <sc-raw-tr style=\"border-bottom: 1px solid #E7EFE9;\">\n        <sc-raw-th style=\"text-align: left; padding: 8px 0; width: 260px; font-family: 'Manrope', sans-serif; font-weight: 700;\">File<\u002Fsc-raw-th>\n        <sc-raw-th style=\"text-align: left; padding: 8px 0; font-family: 'Manrope', sans-serif; font-weight: 700;\">Use<\u002Fsc-raw-th>\n      <\u002Fsc-raw-tr>\n    <\u002Fsc-raw-thead>\n    <sc-raw-tbody>\n      <sc-raw-tr style=\"border-bottom: 1px solid #E7EFE9;\"><sc-raw-td style=\"padding: 8px 0; font-family: ui-monospace, monospace; font-size: 12.5px;\">excel-automate-lockup.svg<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 0;\">Full lockup, live text — inline in the page<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom: 1px solid #E7EFE9;\"><sc-raw-td style=\"padding: 8px 0; font-family: ui-monospace, monospace; font-size: 12.5px;\">excel-automate-lockup.png<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 0;\">1680px transparent — email, documents<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom: 1px solid #E7EFE9;\"><sc-raw-td style=\"padding: 8px 0; font-family: ui-monospace, monospace; font-size: 12.5px;\">excel-automate-mark.svg<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 0;\">Mark alone, static<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom: 1px solid #E7EFE9;\"><sc-raw-td style=\"padding: 8px 0; font-family: ui-monospace, monospace; font-size: 12.5px;\">animated-mark-snippet.html<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 0;\">Animated mark as inline SVG, ready to paste<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom: 1px solid #E7EFE9;\"><sc-raw-td style=\"padding: 8px 0; font-family: ui-monospace, monospace; font-size: 12.5px;\">excel-automate-avatar.svg / .png<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 0;\">Round avatar, two cogs, 512px<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom: 1px solid #E7EFE9;\"><sc-raw-td style=\"padding: 8px 0; font-family: ui-monospace, monospace; font-size: 12.5px;\">excel-automate-avatar-table.svg / .png<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 0;\">Round avatar, cog over table, 512px<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom: 1px solid #E7EFE9;\"><sc-raw-td style=\"padding: 8px 0; font-family: ui-monospace, monospace; font-size: 12.5px;\">excel-automate-favicon*.svg / .png<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 0;\">256 / 64 / 32px two cogs; 16px single cog<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"padding: 8px 0; font-family: ui-monospace, monospace; font-size: 12.5px;\">excel-automate-og.png<\u002Fsc-raw-td><sc-raw-td style=\"padding: 8px 0;\">1200×630 link preview — social, messaging<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n  <p style=\"font-family: 'Public Sans', sans-serif;
